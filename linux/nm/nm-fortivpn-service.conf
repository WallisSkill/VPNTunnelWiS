<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  The system bus refuses a name to anyone not explicitly permitted, so without this file
  nm-fortivpn-service starts, fails to claim its name, and exits -- and NetworkManager reports
  only that the VPN service "appeared to die", which says nothing about why.

  root may own the name and talk to it. Everyone else may do neither: the service takes a
  gateway, an account and a password and runs a privileged client with them, so the only
  caller it should ever have is NetworkManager, which is root.
-->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.NetworkManager.fortivpn"/>
    <allow send_destination="org.freedesktop.NetworkManager.fortivpn"/>
    <allow send_interface="org.freedesktop.NetworkManager.VPN.Plugin"/>
  </policy>

  <policy context="default">
    <deny own="org.freedesktop.NetworkManager.fortivpn"/>
    <deny send_destination="org.freedesktop.NetworkManager.fortivpn"/>
  </policy>
</busconfig>
