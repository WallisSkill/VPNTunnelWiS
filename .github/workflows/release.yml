# Builds the package and publishes the zip.
#
# Push a tag to cut a release:
#
#     git tag v0.2.0.19 && git push origin v0.2.0.19
#
# Running it by hand from the Actions tab builds the same thing and leaves the zip as a
# workflow artifact instead, which is the way to check a change before tagging it.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release; nothing else is written

jobs:
  build:
    # Windows only, and not by preference: the build needs cl.exe with the C++ toolset,
    # the Windows SDK's makepri, and a win-x64 self-contained publish.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # -NoBump: the version in Package.appxmanifest is what is committed, so a build
      # here must report that number rather than invent a higher one no tag matches.
      - name: Build
        run: powershell -ExecutionPolicy Bypass -File build.ps1 -NoBump

      - name: Package
        run: powershell -ExecutionPolicy Bypass -File package.ps1

      - name: Installer
        run: powershell -ExecutionPolicy Bypass -File installer.ps1

      - name: Read the version out of the manifest
        id: version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src\Shell\Package.appxmanifest)).Package.Identity.Version
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: FortiVpnPlugin-${{ steps.version.outputs.version }}
          path: |
            out/*.exe
            out/*.zip

      # Written as a file rather than passed to --notes: markdown full of backticks and
      # asterisks does not survive being a PowerShell argument, and a YAML block scalar
      # carries it through untouched.
      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          Download **FortiVpnSetup-VERSION.exe** and run it. That is the whole install:
          no unpacking, no PowerShell, no administrator. Run it again with `/remove` to
          uninstall.

          The `.zip` is the same layout for anyone who would rather run `install.ps1`
          themselves.

          Either way **Developer Mode** has to be on (Settings > System > For developers).
          That is what lets Windows register an unsigned package, and turning it on does
          not need an administrator either.
          NOTES
          sed -i "s/VERSION/${{ steps.version.outputs.version }}/g" release-notes.md

      # Only when a tag was pushed. gh is preinstalled on the runner, so no third-party
      # action gets a token here.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The .exe first, so it is the asset listed at the top of the release.
          $assets = @(Get-ChildItem out\*.exe, out\*.zip | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets `
            --title $env:GITHUB_REF_NAME `
            --notes-file release-notes.md
