# Builds the package and publishes the zip.
#
# Push a tag to cut a release:
#
#     git tag v1.0.0.6 && git push origin v1.0.0.6
#
# The tag must match the version in src\Shell\Package.appxmanifest (a v-prefix on the tag,
# bare in the manifest); the self-updater compares the two, so a mismatch makes it miss or
# misreport the release.
#
# Running it by hand from the Actions tab builds the same thing and leaves the zip as a
# workflow artifact instead, which is the way to check a change before tagging it.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release; nothing else is written

jobs:
  # The macOS/Linux client (src/Cli). Plain .NET with no native toolchain, so it
  # cross-publishes from one Linux runner to every target RID -- and it must not be
  # built on the Windows job, whose whole point is the toolchain this does not need.
  # Self-contained single files: the people who get these should not have to install
  # a runtime first.
  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/Cli -c Release -r ${{ matrix.rid }}
          --self-contained -p:PublishSingleFile=true
          -o out/cli-${{ matrix.rid }}

      # Named per RID so the four artifacts stay apart, and renamed on the way out so a
      # release page lists fortivpn-osx-arm64 rather than four files all called fortivpn.
      - name: Name the binary after its target
        run: mv out/cli-${{ matrix.rid }}/fortivpn out/fortivpn-${{ matrix.rid }}

      # Linux gets a second asset: the binary plus the desktop integration in one tarball,
      # so installing is download-extract-one-command instead of a list of steps. It has to
      # be a tar and not the zip the artifact upload would give, because zip carries no
      # permission bits -- the scripts and the client must arrive executable, and the whole
      # point of this bundle is that nobody has to be told to chmod anything.
      - name: Bundle the Ubuntu installer
        if: startsWith(matrix.rid, 'linux')
        run: |
          mkdir -p pkg/fortivpn/nm
          cp out/fortivpn-${{ matrix.rid }} pkg/fortivpn/
          cp linux/install.sh linux/fortivpn-session linux/fortivpn-gui \
             linux/org.fortivpn.session.policy linux/fortivpn.desktop pkg/fortivpn/
          # nm/ is the NetworkManager integration: optional, run after install.sh, and the
          # reason a profile can appear in Settings > Network at all.
          cp linux/nm/install-nm.sh linux/nm/nm-fortivpn-service \
             linux/nm/nm-fortivpn-auth-dialog linux/nm/nm-fortivpn-service.name \
             linux/nm/nm-fortivpn-service.conf pkg/fortivpn/nm/
          chmod +x pkg/fortivpn/install.sh pkg/fortivpn/fortivpn-session \
                   pkg/fortivpn/fortivpn-gui pkg/fortivpn/fortivpn-${{ matrix.rid }} \
                   pkg/fortivpn/nm/install-nm.sh pkg/fortivpn/nm/nm-fortivpn-service \
                   pkg/fortivpn/nm/nm-fortivpn-auth-dialog
          tar -C pkg -czf out/fortivpn-${{ matrix.rid }}.tar.gz fortivpn

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: out/fortivpn-${{ matrix.rid }}*

  build:
    # Windows only, and not by preference: the build needs cl.exe with the C++ toolset,
    # the Windows SDK's makepri, and a win-x64 self-contained publish.
    runs-on: windows-latest
    # The release is published from this job, so it waits for the client binaries and
    # attaches them alongside the installer.
    needs: cli

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # The second-factor login parsing, offline. It compiles src\Plugin\TwoFactor.cs and
      # asserts against captured challenge bodies -- no gateway, no credential -- and exits
      # non-zero on any failure, so a broken 2FA path fails the release before it is built.
      - name: Test the 2FA login parsing
        run: dotnet run --project tools/TwoFactorTest -c Release --nologo

      # The self-updater's version-parsing and comparison logic, offline. It never touches
      # the network in this mode and exits non-zero on any failure, so a broken update check
      # -- one that would nag on bad data or miss a real release -- fails the build.
      - name: Test the self-update logic
        run: powershell -ExecutionPolicy Bypass -File update.ps1 -SelfTest

      # -NoBump: the version in Package.appxmanifest is what is committed, so a build
      # here must report that number rather than invent a higher one no tag matches.
      - name: Build
        run: powershell -ExecutionPolicy Bypass -File build.ps1 -NoBump

      - name: Package
        run: powershell -ExecutionPolicy Bypass -File package.ps1

      - name: Installer
        run: powershell -ExecutionPolicy Bypass -File installer.ps1

      - name: Read the version out of the manifest
        id: version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src\Shell\Package.appxmanifest)).Package.Identity.Version
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: FortiVpnPlugin-${{ steps.version.outputs.version }}
          path: |
            out/*.exe
            out/*.zip

      # The four client binaries from the cli job, flattened into out\ next to the
      # installer so the publish step below picks them all up in one sweep.
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: out
          merge-multiple: true

      # Written as a file rather than passed to --notes: markdown full of backticks and
      # asterisks does not survive being a PowerShell argument, and a YAML block scalar
      # carries it through untouched.
      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          ## Windows

          Download **FortiVpnSetup-VERSION.exe** and run it. That is the whole install:
          no unpacking, no PowerShell, no administrator. Run it again with `/remove` to
          uninstall.

          The `.zip` is the same layout for anyone who would rather run `install.ps1`
          themselves.

          Either way **Developer Mode** has to be on (Settings > System > For developers).
          That is what lets Windows register an unsigned package, and turning it on does
          not need an administrator either.

          The installer is unsigned, so SmartScreen will stop it the first time with
          "Windows protected your PC" — choose **More info** then **Run anyway**.

          ## Linux desktop (Ubuntu, and anything else with GNOME/KDE)

          Download **`fortivpn-linux-x64.tar.gz`** (or `-arm64` on ARM), unpack it and run
          the installer once:

          ```
          tar xzf fortivpn-linux-x64.tar.gz
          cd fortivpn && sudo ./install.sh
          ```

          It asks for the gateway and your account name, works out the gateway
          certificate's fingerprint and pins it for you, and registers a **FortiGate VPN**
          entry in your applications. After that there is no terminal and no `sudo`: click
          it to connect, click it again to disconnect. The password and one-time code are
          typed into the desktop prompt and are never stored.

          Remove it with `sudo ./install.sh --uninstall`.

          ### In Settings → Network instead of the app grid

          One more step turns it into a **NetworkManager VPN connection**, driven by this
          same client rather than by openfortivpn:

          ```
          cd nm && sudo ./install-nm.sh
          ```

          **FortiGate VPN** is then in **Settings → Network**, with a switch in the top-bar
          menu and an autoconnect option. It does not appear under Settings → "+" — creating
          a profile by mouse needs a GTK module in C — so the installer writes the profile
          for you.

          ## macOS, or Linux without a desktop

          The bare client, run by hand:

          | file | for |
          | --- | --- |
          | `fortivpn-osx-arm64` | macOS, Apple Silicon |
          | `fortivpn-osx-x64` | macOS, Intel |
          | `fortivpn-linux-x64` | Linux, Intel/AMD |
          | `fortivpn-linux-arm64` | Linux, ARM |

          ```
          chmod +x fortivpn-osx-arm64
          sudo ./fortivpn-osx-arm64 vpn.example.com:PORT
          ```

          On **macOS** the download is quarantined and Gatekeeper will refuse to run it —
          these binaries are not signed by an Apple developer account. Clear the flag once:

          ```
          xattr -d com.apple.quarantine fortivpn-osx-arm64
          ```

          Nothing to install either way: the runtime is inside the binary. It does need
          **sudo** — opening a tunnel interface and setting routes requires root there, so
          the no-administrator property is specific to the Windows plugin. See
          [docs/mac-linux.md](docs/mac-linux.md) for the options, certificate pinning and
          DNS notes.
          NOTES
          sed -i "s/VERSION/${{ steps.version.outputs.version }}/g" release-notes.md

      # Only when a tag was pushed. gh is preinstalled on the runner, so no third-party
      # action gets a token here.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Named explicitly rather than globbed. A glob that silently matches three files
          # instead of four still publishes a release, just a broken one; naming what must
          # be there turns a missing target into a failed build with the target in the
          # message.
          $expected  = @('linux-x64','linux-arm64','osx-x64','osx-arm64' |
                         ForEach-Object { "out\fortivpn-$_" })
          $expected += @('linux-x64','linux-arm64' |
                         ForEach-Object { "out\fortivpn-$_.tar.gz" })

          $missing = @($expected | Where-Object { -not (Test-Path $_) })
          if ($missing) { throw "The cli job did not produce: $($missing -join ', ')" }

          # The .exe first, so it is the asset listed at the top of the release page, then
          # the zip, then the macOS/Linux downloads.
          $windows = @(Get-ChildItem out\*.exe, out\*.zip -ErrorAction SilentlyContinue |
                       ForEach-Object FullName)
          if (-not $windows) { throw "No installer or zip in out\ -- the Windows build produced nothing." }

          $assets = $windows + @($expected | ForEach-Object { (Resolve-Path $_).Path })
          $assets | ForEach-Object { Write-Host "asset: $_" }

          # $assets, not @assets: passing an array to a native command already spreads it
          # into one argument per element, and the splat form is a cmdlet convention that
          # only happens to work here.
          gh release create $env:GITHUB_REF_NAME $assets `
            --title $env:GITHUB_REF_NAME `
            --notes-file release-notes.md
